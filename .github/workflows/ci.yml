name: Review verification (testing fork only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photocraft-review-verification
  cancel-in-progress: false
jobs:
  gate:
    name: Full unchanged CI and corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      PHOTOCRAFT_NO_PRINT: "1"
      LPDEST: photocraft-no-such-printer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f279aef45d5aa346b74dfad50074ee18a51b280a
          persist-credentials: false
      - name: Apply exact import preservation correction on existing PR head
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/import.patch
          echo '3af8de61d7948388baeb5a5a8515e6baf7acd1459a77d77a3cdd58a7ae905705  /tmp/import.patch' | sha256sum --check
          git apply --check /tmp/import.patch
          git apply /tmp/import.patch
      - name: Linux system dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers
      - name: Stable Rust and WASM target
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default stable
      - name: Full unchanged workspace gate
        run: cargo xtask ci
      - name: Command adversarial-input tests
        run: cargo test -p photocraft-engine --test panic_hunt -- --ignored
      - name: Full pinned release corpus gate
        run: cargo xtask test-corpus
